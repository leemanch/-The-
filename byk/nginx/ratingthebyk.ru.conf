# Initial HTTP configuration for nginx running on the Docker host.
# Once DNS points to this server, enable TLS with certbot --nginx.
server {
    listen 80;
    server_name ratingthebyk.ru;

    location / {
        proxy_pass http://127.0.0.1:28741;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
